name: Refresh GitHub contributions

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/lib/githubContributions.ts'
      - 'src/data/portfolio.ts'
      - '.github/workflows/github-contributions.yml'

permissions:
  contents: write

concurrency:
  group: github-contributions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect and validate GitHub's public calendar
        run: npm run refresh:github
      - name: Save verified calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-contributions.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh public GitHub contribution calendar" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
